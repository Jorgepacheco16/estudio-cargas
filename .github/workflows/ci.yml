name: ci
on: { pull_request: {}, push: { branches: [main] } }
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: pg_admin, POSTGRES_DB: studydb }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_ADMIN: postgres://postgres:pg_admin@localhost:5432/studydb
      DATABASE_URL: postgres://app_user:app_pw@localhost:5432/studydb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - name: Migraciones reales sobre PostgreSQL real
        run: |
          psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -f sql/local_bootstrap.sql
          psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -f drizzle/0000_init.sql
          psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -f sql/0001_rls.sql
          psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -f drizzle/0001_weeks_per_month_precision.sql
          psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -f drizzle/0002_sheet_connections_actor.sql
          psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -f sql/0002_sheets.sql
          psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -f drizzle/0003_deviation_thresholds.sql
          psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -f sql/0003_history.sql
          psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -f drizzle/0004_position_shifts.sql
          psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -f sql/0004_shifts.sql
          psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -f drizzle/0005_shift_days.sql
          psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -f drizzle/0006_position_operation.sql
          psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -f drizzle/0007_diagnostico_centro_operaciones.sql
          psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -f drizzle/0008_position_shift_type.sql
      - run: npm run test:rls
      - run: npm run test:f3
      - run: npm run test:capture
      - run: npm run test:shiftsdb
      - run: npm run test:bulkdb
      - run: npm run test:filtersdb
      - run: npm run test:matrix
      - run: npm run test:policies
      - run: npm run test:backup
      - run: npm run test:agent
      - run: npm run test:sheets
      - run: npm run test:webhook
      - run: npm run test:history
      - run: npm run test:import
      - run: npm run test:domain
      - run: npm run test:labels
      - run: npm run test:summary
      - run: npm run test:calculators
      - run: npm run test:drill
      - run: npm run test:oracle
      - run: npm run test:hook
      - run: npm run test:arch
      - name: Prueba dorada contra el Excel (LibreOffice real)
        run: sudo apt-get update && sudo apt-get install -y libreoffice-calc && npm run test:golden
      - run: npm audit --omit=dev --audit-level=high
  secrets-and-sast:
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write, actions: read }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: github/codeql-action/init@v4
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@v4
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Usuario y clave de demostración solo para esta ejecución (aleatorios; no son secretos del proyecto)
        run: |
          node -e '
          const c = require("crypto");
          const pw = c.randomBytes(12).toString("hex"), salt = c.randomBytes(16);
          console.log("DEMO_USER=ci-demo");
          console.log("E2E_DEMO_PASSWORD=" + pw);
          console.log("DEMO_PASSWORD_HASH=scrypt$" + salt.toString("hex") + "$" + c.scryptSync(pw, salt, 32).toString("hex"));
          console.log("GUEST_SESSION_SECRET=" + c.randomBytes(32).toString("hex"));
          ' >> "$GITHUB_ENV"
      - name: Pruebas de navegador (ingreso, puerta de entrada y demostración como invitado)
        run: npx playwright test e2e/publico.spec.ts
  restore:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: pg_admin, POSTGRES_DB: studydb }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_ADMIN: postgres://postgres:pg_admin@localhost:5432/studydb
      DATABASE_URL: postgres://app_user:app_pw@localhost:5432/studydb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Migraciones reales sobre PostgreSQL real
        run: |
          psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -f sql/local_bootstrap.sql
          for f in drizzle/0000_init.sql sql/0001_rls.sql drizzle/0001_weeks_per_month_precision.sql drizzle/0002_sheet_connections_actor.sql sql/0002_sheets.sql drizzle/0003_deviation_thresholds.sql sql/0003_history.sql drizzle/0004_position_shifts.sql sql/0004_shifts.sql drizzle/0005_shift_days.sql drizzle/0006_position_operation.sql drizzle/0007_diagnostico_centro_operaciones.sql drizzle/0008_position_shift_type.sql; do
            psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Sembrar un estudio completo en la base de origen
        run: npx tsx scripts/restore-seed.ts
      - name: Copia de seguridad real (pg_dump) y restauración (pg_restore) en otra base, con las mismas herramientas de PostgreSQL 16
        run: |
          docker run --rm --network host -e PGPASSWORD=pg_admin postgres:16 pg_dump -h localhost -U postgres --format=custom studydb > backup.dump
          ls -l backup.dump
          psql "postgres://postgres:pg_admin@localhost:5432/postgres" -v ON_ERROR_STOP=1 -c 'create database studydb_restored'
          docker run -i --rm --network host -e PGPASSWORD=pg_admin postgres:16 pg_restore -h localhost -U postgres -d studydb_restored --exit-on-error < backup.dump
      - name: Verificar la base restaurada (filas, RLS, aislamiento y resultados)
        env:
          RESTORE_ADMIN_URL: postgres://postgres:pg_admin@localhost:5432/studydb_restored
          RESTORE_APP_URL: postgres://app_user:app_pw@localhost:5432/studydb_restored
        run: npx tsx scripts/restore-verify.ts | tee restore.out
